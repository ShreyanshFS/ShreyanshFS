<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Shreyansh Dwivedi, Aspiring Software Engineer">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a33"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="g1" cx="0.15" cy="0.2" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
<clipPath id="r"><rect width="960" height="330" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes cyc{0%{opacity:0}3%{opacity:1}17%{opacity:1}20%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.a{animation:fade .7s ease-out both}
.cur{animation:blink 1s steps(1) infinite}
.ph{opacity:0;animation:cyc 15s infinite both;font-size:20px}
.ph0{opacity:1}
.dot{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.a,.cur,.ph,.dot{animation:none} .ph{opacity:0} .ph0{opacity:1}}
</style>
<g clip-path="url(#r)">
<rect width="960" height="330" fill="url(#bg)"/><rect width="960" height="330" fill="url(#dots)"/>
<rect width="960" height="330" fill="url(#g1)"/><rect width="960" height="330" fill="url(#g2)"/>
<rect width="960" height="44" fill="#ffffff" fill-opacity="0.04"/>
