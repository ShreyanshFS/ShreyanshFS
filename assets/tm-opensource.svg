<text x="28" y="30" font-size="10" letter-spacing="2" fill="#79c0ff">TICKET-BOOKING-SYSTEM  ·  PR #21</text>
<text x="28" y="56" font-size="18" font-weight="700" fill="#e6edf3">Booking features</text>
<text x="28" y="76" font-size="11" fill="#8b9893">Confirmation emails, seat double-booking</text>
<text x="28" y="92" font-size="11" fill="#8b9893">prevention and a protected cancel endpoint.</text>
