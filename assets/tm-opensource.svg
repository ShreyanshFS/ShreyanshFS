<text x="28" y="30" font-size="10" letter-spacing="2" fill="#ffb454">NARRATE-AI  ·  PR #32</text>
<text x="28" y="56" font-size="18" font-weight="700" fill="#e6edf3">Vitest unit tests</text>
<text x="28" y="76" font-size="11" fill="#8b9893">Test setup plus tests for JSON parsing</text>
<text x="28" y="92" font-size="11" fill="#8b9893">and voice scoring.</text>
<g transform="translate(368.8,92)"><rect width="73.2" height="22" rx="11" fill="#8957e5" fill-opacity="0.22" stroke="#8957e5" stroke-opacity="0.6"/><circle class="dot" cx="13" cy="11" r="3" fill="#d2a8ff"/><text x="24" y="15" font-size="10" letter-spacing="1" fill="#d2a8ff">MERGED</text></g></g></g>
<g transform="translate(0,202)"><g class="card" style="animation-delay:0.3s"><g clip-path="url(#c)"><rect width="470" height="124" fill="url(#bg)"/><rect width="5" height="124" fill="#ff7b72"/><rect class="sweep" x="0" y="0" width="160" height="124" fill="url(#sh)" style="animation-delay:1.6s"/></g><rect x="0.5" y="0.5" width="469" height="123" rx="14" fill="none" stroke="#fff" stroke-opacity="0.13"/>
<text x="28" y="30" font-size="10" letter-spacing="2" fill="#ff7b72">NARRATE-AI  ·  PR #20</text>
<text x="28" y="56" font-size="18" font-weight="700" fill="#e6edf3">Chrome extension</text>
<text x="28" y="76" font-size="11" fill="#8b9893">Manifest V3 extension that prefills story text</text>
<text x="28" y="92" font-size="11" fill="#8b9893">from any page.</text>
<g transform="translate(289.6,92)"><rect width="152.4" height="22" rx="11" fill="#6e7681" fill-opacity="0.22" stroke="#6e7681" stroke-opacity="0.6"/><circle class="dot" cx="13" cy="11" r="3" fill="#a9b6af"/><text x="24" y="15" font-size="10" letter-spacing="1" fill="#a9b6af">MERGED · REVERTED</text></g></g></g>
