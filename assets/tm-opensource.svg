<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="open source contributions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>open source contributions</title>
<defs><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d2a8ff"/><stop offset="1" stop-color="#d2a8ff" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b100f"/><stop offset="1" stop-color="#141d1a"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="470" height="124" rx="14"/></clipPath>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.card{opacity:0;animation:in .7s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sweep{animation:sw 5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-200px)}60%,100%{transform:translateX(520px)}}
.dot{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.ln{transform-origin:0 0;animation:g 1s ease-out forwards;transform:scaleX(0)}
@keyframes g{to{transform:scaleX(1)}}
</style></defs>
<text x="2" y="31" font-size="18" font-weight="700" fill="#d2a8ff">+</text><text x="22" y="31" font-size="18" fill="#7f8c86">/</text><text x="40" y="31" font-size="18" fill="#a9b6af" letter-spacing="1">open source</text><rect class="ln" x="172" y="24" width="786" height="2" rx="1" fill="url(#ln)"/>
<g transform="translate(0,64)"><g class="card" style="animation-delay:0.0s"><g clip-path="url(#c)"><rect width="470" height="124" fill="url(#bg)"/><rect width="5" height="124" fill="#7ee787"/><rect class="sweep" x="0" y="0" width="160" height="124" fill="url(#sh)" style="animation-delay:0.0s"/></g><rect x="0.5" y="0.5" width="469" height="123" rx="14" fill="none" stroke="#fff" stroke-opacity="0.13"/>
<text x="28" y="30" font-size="10" letter-spacing="2" fill="#7ee787">NARRATE-AI  ·  PR #31</text>
<text x="28" y="56" font-size="18" font-weight="700" fill="#e6edf3">Groq error handling</text>
<text x="28" y="76" font-size="11" fill="#8b9893">Retry with exponential backoff so API failures</text>
<text x="28" y="92" font-size="11" fill="#8b9893">no longer break narration.</text>
<g transform="translate(368.8,92)"><rect width="73.2" height="22" rx="11" fill="#8957e5" fill-opacity="0.22" stroke="#8957e5" stroke-opacity="0.6"/><circle class="dot" cx="13" cy="11" r="3" fill="#d2a8ff"/><text x="24" y="15" font-size="10" letter-spacing="1" fill="#d2a8ff">MERGED</text></g></g></g>
